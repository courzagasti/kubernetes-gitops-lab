name: CI Docker GitOps
on:
  push:
    branches: [main]
    paths-ignore:
      - 'kubernetes/deployment.yaml'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: |
          cd app
          npm install --no-audit --no-fund
          npm test
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Update manifest and commit
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYUPDATE'
          import os
          from pathlib import Path
          p = Path('kubernetes/deployment.yaml')
          s = p.read_text()
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if line.strip().startswith('image: ghcr.io/'):
                  lines[i] = '          image: ghcr.io/' + os.environ['REPO'].lower() + ':' + os.environ['SHA']
          p.write_text('\n'.join(lines) + '\n')
          PYUPDATE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kubernetes/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): deploy $SHA [skip ci]"
            git push
          fi
